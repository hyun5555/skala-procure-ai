name: Checks

on:
  pull_request:
  push:
    branches: [main]

# 개인 개발에서도 현행 교육 런타임의 호환성은 검증한다.
# 인증·게이트웨이 교체가 검증되면 이 guard와 docs/constraints.md를 함께 갱신한다.

permissions:
  contents: read

jobs:
  documents:
    name: Documentation and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links and preserved team records
        run: python3 scripts/check-docs.py

  runtime-checker:
    name: Runtime checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shipping deadline without network or database
        run: python3 -m unittest discover -s scripts -p 'test_runtime_transactions.py' -v

  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 게이트웨이 라우팅은 빌드된 이미지에 고정되어 있고 catch-all 라우트가 없다.
      # 경로를 바꾸면 프론트에서 즉시 404 가 되는데 원인을 찾기 어렵다.
      - name: API 경로를 바꾸지 않는다
        run: |
          fail=0
          for pair in \
            "user-service:/api/users" \
            "course-service:/api/courses" \
            "enrollment-service:/api/enrollments" \
            "payment-service:/api/payments"
          do
            svc="${pair%%:*}"; path="${pair##*:}"
            if ! grep -rq "RequestMapping(\"$path\")" "$svc/src" 2>/dev/null; then
              echo "::error::$svc 의 @RequestMapping 이 $path 가 아닙니다. 게이트웨이가 라우팅하지 못해 404 가 됩니다."
              fail=1
            fi
          done
          if ! grep -q 'prefix="/api/recommend"' recommend-service/app/router/recommend_router.py; then
            echo "::error::recommend-service 의 라우터 prefix 가 /api/recommend 가 아닙니다."
            fail=1
          fi
          exit $fail

      # auth-server 에 localhost:3000/callback 이 하드코딩되어 다른 포트는 로그인이 거부된다.
      - name: 프론트엔드 포트는 3000 이다
        run: |
          if ! grep -q 'port: *3000' vue-frontend/vite.config.js; then
            echo "::error::vue-frontend/vite.config.js 의 port 가 3000 이 아닙니다. auth-server 가 redirect_uri 를 거부합니다."
            grep -n 'port:' vue-frontend/vite.config.js || true
            exit 1
          fi
          if ! grep -q 'VITE_REDIRECT_URI=http://localhost:3000/callback' vue-frontend/.env; then
            echo "::error::vue-frontend/.env 의 VITE_REDIRECT_URI 가 auth-server 등록값과 다릅니다."
            exit 1
          fi
          echo "포트 3000 유지"

      # infra-images.tar 가 343MB 로 저장소 루트에 있다. 실수로 들어오면 push 자체가 거부된다.
      - name: 대용량 파일을 커밋하지 않는다
        run: |
          large=$(git ls-files | while IFS= read -r f; do
            if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 41943040 ]; then printf '%s\n' "$f"; fi
          done)
          if [ -n "$large" ]; then
            echo "::error::40MB 를 넘는 파일이 커밋되어 있습니다. .gitignore 를 확인하세요."
            printf '%s\n' "$large"
            exit 1
          fi
          echo "대용량 파일 없음"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: vue-frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: vue-frontend
        run: npm run build

# 현행 CI는 문서·호환성·프론트 빌드·실행 검증기의 격리 테스트를 다룬다.
# Java/Python 변경은 해당 서비스 테스트 결과를 기록한다.
# 서비스별 자동 테스트와 의존성 lock 정리는 개인 백로그에서 추가한다.
