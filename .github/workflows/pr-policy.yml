name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  policy:
    name: PR Policy
    runs-on: ubuntu-latest
    steps:
      # Squash merge 라 개별 커밋 메시지는 main 에 남지 않는다.
      # 그래서 커밋 메시지는 검사하지 않고 브랜치 이름과 PR 제목만 본다.
      - name: 브랜치 이름 검사
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feat|fix|refactor|docs|test|chore|ci|hotfix)/[a-z0-9][a-z0-9-]*$'; then
            echo "::error::브랜치 이름이 규칙에 맞지 않습니다: $BRANCH"
            echo "형식: <type>/<kebab-case>  예: feat/supplier-catalog-labels"
            echo "허용 type: feat fix refactor docs test chore ci hotfix"
            exit 1
          fi
          echo "브랜치 이름 통과: $BRANCH"

      - name: PR 제목 검사
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|refactor|docs|test|chore|ci|build|perf|revert)(\([a-z0-9-]+\))?: .+'; then
            echo "::error::PR 제목이 Conventional Commits 형식이 아닙니다: $TITLE"
            echo "형식: <type>(<optional-scope>): <summary>"
            echo "예: feat(web): map category labels to supplier domain"
            exit 1
          fi
          if printf '%s' "$TITLE" | grep -q '\.$'; then
            echo "::error::PR 제목 끝에 마침표를 붙이지 않습니다."
            exit 1
          fi
          echo "PR 제목 통과: $TITLE"

      - name: PR 본문이 비어 있지 않은지 검사
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          stripped=$(printf '%s' "$BODY" | sed 's/<!--.*-->//g' | tr -d '[:space:]#-')
          if [ -z "$stripped" ]; then
            echo "::error::PR 본문이 비어 있습니다. Squash merge 라 PR 본문이 main 에 남는 유일한 기록입니다."
            exit 1
          fi
          echo "PR 본문 있음"
