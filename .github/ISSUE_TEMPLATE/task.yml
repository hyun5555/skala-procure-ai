name: 작업
description: Sprint 백로그 항목
labels: [task]
body:
  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options: ["Sprint 1", "Sprint 2", "미정"]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 완료 기준
      description: 무엇이 화면에서 동작하면 끝인지 적어 주세요.
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 건드리는 곳
      placeholder: vue-frontend/src/store/course.js
  - type: checkboxes
    id: backend
    attributes:
      label: 백엔드 수정이 필요한가
      options:
        - label: 자바 수정이 필요합니다 (재빌드 필요, 사유를 아래에 적어 주세요)
  - type: textarea
    id: notes
    attributes:
      label: 비고
