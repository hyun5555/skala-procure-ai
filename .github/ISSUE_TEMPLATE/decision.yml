name: 결정 필요
description: 사슬의 두 칸이 어긋났거나 팀 합의가 필요한 사항
labels: [decision]
body:
  - type: textarea
    id: conflict
    attributes:
      label: 어느 두 칸이 어긋났는가
      description: 기획안 / 화면 / API 명세 / 서비스 코드 / 스키마 중 어디와 어디인지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: side_a
    attributes:
      label: 한쪽의 현재 상태 (원문 인용)
      description: 요약하지 말고 원문을 그대로 붙여 주세요.
    validations:
      required: true
  - type: textarea
    id: side_b
    attributes:
      label: 다른 쪽의 현재 상태 (원문 인용)
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 어느 쪽에 맞추면 무엇을 고쳐야 하는가
    validations:
      required: true
